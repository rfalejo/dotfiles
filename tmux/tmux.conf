# ~/.tmux.conf — tuned for Linux, WSL2, and Claude Code
# Reload with: prefix r

# ── Terminal & colors ─────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"          # truecolor passthrough
set -as terminal-features ",xterm*:extkeys"      # modified keys (Shift+Enter etc.)
set -s extended-keys on
set -s extended-keys-format csi-u
set -g focus-events on
set -g allow-passthrough on                      # let apps emit OSC sequences (notifications)
set -s set-clipboard on                          # OSC 52 clipboard passthrough
set -ga update-environment "WT_SESSION WT_PROFILE_ID WSL_DISTRO_NAME"

# ── Responsiveness ────────────────────────────────────────────────
set -s escape-time 10                            # no lag on Esc (important for Claude Code / vim)
set -g repeat-time 400
set -g history-limit 100000
set -g display-time 2000

# ── General behavior ──────────────────────────────────────────────
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename on
set -g set-titles on
set -g set-titles-string "#S:#I #W"
setw -g aggressive-resize on
set -g detach-on-destroy off                     # switch to another session instead of detaching

# ── Keys ──────────────────────────────────────────────────────────
# Prefix stays C-b; C-a also works as a second prefix
set -g prefix2 C-a
bind C-a send-prefix -2

bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# Splits and new windows open in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation and resizing
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick window switching
bind -r C-h previous-window
bind -r C-l next-window
bind Tab last-window

# Popup shell / session picker
bind g display-popup -E -w 80% -h 80% -d "#{pane_current_path}"
bind s choose-tree -Zs

# ── Copy mode (vi) ────────────────────────────────────────────────
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "~/.config/tmux/copy.sh"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "~/.config/tmux/copy.sh"

# ── Look: Solarized Dark ──────────────────────────────────────────
# base03 #070d15  base02 #0f1b29 (darkened)  base01 #586e75  base0 #839496  base1 #93a1a1
# yellow #b58900  orange #cb4b16  red #dc322f  magenta #d33682  violet #6c71c4
# blue #268bd2  cyan #2aa198  green #859900
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#0f1b29,fg=#839496"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#070d15,bg=#859900,bold] #S #[bg=#0f1b29] "
set -g status-right "#{?client_prefix,#[fg=#070d15 bg=#b58900 bold] PREFIX #[default] ,}#[fg=#586e75]#h #[fg=#586e75]│ #[fg=#268bd2,bold]%H:%M #[fg=#586e75]%d %b "

setw -g window-status-format "#[fg=#586e75] #I:#W#{?window_zoomed_flag, ⤢,} "
setw -g window-status-current-format "#[fg=#070d15,bg=#268bd2,bold] #I:#W#{?window_zoomed_flag, ⤢,} "
setw -g window-status-separator ""
setw -g window-status-activity-style "fg=#cb4b16"
setw -g window-status-bell-style "fg=#dc322f,bold"
setw -g monitor-activity on
set -g visual-activity off

set -g pane-border-style "fg=#0f1b29"
set -g pane-active-border-style "fg=#268bd2"
set -g pane-border-lines heavy
set -g message-style "fg=#070d15,bg=#b58900,bold"
set -g message-command-style "fg=#070d15,bg=#2aa198"
setw -g mode-style "fg=#070d15,bg=#b58900"
set -g display-panes-active-colour "#268bd2"
set -g display-panes-colour "#586e75"
setw -g clock-mode-colour "#268bd2"
set -g popup-border-style "fg=#586e75"
set -g popup-border-lines rounded
